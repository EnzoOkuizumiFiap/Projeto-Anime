management.info.env.enabled=true

spring.application.name=animes
info.app.name="API de animes"
info.app.description="API de gerenciamento de animes"
info.app.author="Lucas Barros, Enzo Okuizumi, Milton Marcelino"
info.app.version="1.0.0"

spring.datasource.url=jdbc:h2:mem:animes
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

spring.web.error.include-stacktrace=never

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always